# Which backend serves each portal in a Plasma session. This copy in
# /etc/xdg wins over the one in /usr/share/xdg-desktop-portal, so it
# keeps that file's lines too (Settings, Secret).
#
# Screen sharing, remote control and their clipboard go to the Raye
# backend; files and "Open with" to the Raye file dialogs. Each list
# ends with kde: when a Raye backend is not installed, or does not offer
# that portal, the desktop's own backend serves it. Back to the stock
# share chooser: ScreenCast=kde (and RemoteDesktop=kde, Clipboard=kde).
[preferred]
default=kde;gtk
org.freedesktop.impl.portal.Settings=kde;gtk
org.freedesktop.impl.portal.Secret=kwallet
org.freedesktop.impl.portal.FileChooser=raye-files;kde
org.freedesktop.impl.portal.AppChooser=raye-files;kde
org.freedesktop.impl.portal.ScreenCast=raye;kde
org.freedesktop.impl.portal.RemoteDesktop=raye;kde
org.freedesktop.impl.portal.Clipboard=raye;kde
org.freedesktop.impl.portal.Access=raye;kde
